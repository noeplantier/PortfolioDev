    <link rel="canonical" href="https://plantiers.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://plantiers.com/" />
    <meta property="og:site_name" content="Plantiers" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Plantiers | Software Engineering Studio" />
    <meta
      property="og:description"
      content="Production-grade web and mobile software for teams who can't afford to get it wrong."
    />
    <meta property="og:image" content="https://plantiers.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Plantiers — Engineering Digital Growth." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plantiers | Software Engineering Studio" />
    <meta
      name="twitter:description"
      content="Production-grade web and mobile software for teams who can't afford to get it wrong."
    />
    <meta name="twitter:image" content="https://plantiers.com/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#07060B" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Plantiers",
        "url": "https://plantiers.com",
        "logo": "https://plantiers.com/apple-touch-icon.png",
        "description": "Plantiers is a software engineering studio that designs, builds, and ships production-grade web and mobile software.",
        "email": "plantiernoe50@gmail.com",
        "sameAs": ["https://github.com/noeplantier", "https://www.linkedin.com/company/plantiers/"],
        "founder": {
          "@type": "Person",
          "name": "Noé Plantier"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static hidden form so Netlify's build-time HTML scan can detect it.
      Must stay a sibling of #root, not nested inside it — React fully
      owns #root's contents from first render, so anything nested here
      would vanish from the live DOM (harmless for Netlify's detection,
      which reads the file at rest, but fragile for no reason).
      Field names must exactly match src/components/sections/contact/ContactForm.tsx.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="projectType" />
      <textarea name="message"></textarea>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
